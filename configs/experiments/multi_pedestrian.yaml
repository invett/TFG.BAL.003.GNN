# Multi-Pedestrian Scene-Level Configuration
# Configuration for multi-pedestrian scene-level prediction with temporal dependencies

graph:
  type: 0  # Angie graph
  temporal_type: 4  # Multi-pedestrian scene-level temporal windows
  multi_pedestrian: true
  window_size: 3
  window_step: 1

model:
  name: "GraphConv"
  c_in: 24
  c_hidden: 128
  c_out: 1
  dp_rate_linear: 0.5
  dp_rate: 0.2
  num_layers: 2

dataset:
  name: "JAAD_16K"
  folder: "datasets"

training:
  batch_size: 100
  max_epochs: 50
  checkpoint_path: "./checkpoints"
  learning_rate: 0.001
  lr_scheduler_patience: 1
  early_stopping_patience: 3
  train_val_split: 0.8
  num_workers: 4
  seed: 42

wandb:
  enabled: true
  project: "tfg"
  entity: null
  log_model: true
  tags: ["multi-pedestrian", "scene-level"]

experiment:
  multi_seed: false
  clean_processed: true
